; Ajustes de producción para la API.
expose_php = Off
memory_limit = 256M
max_execution_time = 30
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; El código no cambia dentro del contenedor: no hace falta revisar timestamps.
opcache.validate_timestamps = 0
