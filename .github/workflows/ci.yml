name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · estilo, migraciones y prueba de humo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, sodium, pdo_sqlite, openssl, fileinfo, dom
          coverage: none
          tools: composer:v2

      - name: Validar composer.json y composer.lock
        run: composer validate --no-check-publish

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Estilo de código (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Preparar la app (mismo comando que el README)
        run: composer setup

      - name: Levantar la API
        run: |
          php artisan serve --port=8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/up >/dev/null && break; sleep 1; done

      - name: Prueba de humo de la API
        working-directory: .
        run: ./scripts/smoke-test.sh

      - name: Log de la API si algo falló
        if: failure()
        run: cat /tmp/api.log storage/logs/*.log 2>/dev/null || true

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  docker:
    name: Docker · build y arranque completo
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Validar compose.yml
        run: docker compose config --quiet

      - name: Construir y levantar (db + app + api + web)
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Prueba de humo contra Nginx + PHP-FPM
        run: ./scripts/smoke-test.sh

      - name: La SPA responde (incluida una ruta interna de Vue Router)
        run: |
          curl -sf http://localhost:5173/ | grep -q '<div id="app">'
          curl -sf http://localhost:5173/teams/57 | grep -q '<div id="app">'

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar
        if: always()
        run: docker compose down --volumes
