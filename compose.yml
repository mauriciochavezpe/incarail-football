# Levanta todo el proyecto en Linux con un solo comando:
#   cp .env.example .env   (y pega tu FOOTBALL_DATA_TOKEN)
#   docker compose up -d --build
#
#   SPA  → http://localhost:5173
#   API  → http://localhost:8000
name: incarail-football

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: football
      POSTGRES_USER: football
      POSTGRES_PASSWORD: ${DB_PASSWORD:-football}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # PHP-FPM 8.5 con la API Laravel.
  app:
    build:
      context: ./backend
    environment:
      APP_NAME: "Inca Rail Football API"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:${API_PORT:-8000}
      APP_KEY: ${APP_KEY:-}
      APP_LOCALE: es
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: football
      DB_USERNAME: football
      DB_PASSWORD: ${DB_PASSWORD:-football}
      CACHE_STORE: database
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
      PASSPORT_TOKEN_TTL_HOURS: 8
      FOOTBALL_DATA_TOKEN: ${FOOTBALL_DATA_TOKEN:-}
      FOOTBALL_DATA_BASE_URL: ${FOOTBALL_DATA_BASE_URL:-https://api.football-data.org/v4}
      FOOTBALL_DATA_MAX_REQUESTS_PER_MINUTE: ${FOOTBALL_DATA_MAX_REQUESTS_PER_MINUTE:-10}
    volumes:
      # APP_KEY generada, llaves de Passport y marcas de inicialización.
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Nginx delante de PHP-FPM.
  api:
    image: nginx:1.28-alpine
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${API_PORT:-8000}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # SPA Vue compilada y servida por Nginx.
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  app-storage:
